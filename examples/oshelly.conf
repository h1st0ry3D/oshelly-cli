# ~/.config/oshelly/oshelly.conf
#
# One command per line: a name, a colon, then the command.
#
#   Restart audio: systemctl --user restart pipewire wireplumber
#
# A line whose first non-space character is # is a comment. The first colon
# separates the name from the command, so a name cannot contain a colon.
# Everything after that colon is the command, unchanged.
#
# Names may contain spaces. Two entries cannot have the same name.
#
# The power button in the panel or menu controls whether the terminal closes
# after a command. That setting lives in settings.json, not in this file.

Hello: printf 'Hello from oshelly\n'

# Update: omarchy update
# Tail the journal: journalctl -f
# Screenshot: grim -g "$(slurp)" - | wl-copy
# Update packages: brew upgrade
